appId: ai.nexus.desktop
productName: Nexus AI
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# The native capture-exclusion addon lives outside the asar archive so it can be dlopen'd.
extraResources:
  - from: src/native/build/Release/nexus_native.node
    to: native/nexus_native.node
asar: true
mac:
  target:
    - target: dmg
  # Speech recognition on this computer (sherpa-onnx addon + onnxruntime), loaded by src/native/sherpa.ts.
  extraResources:
    - from: node_modules/sherpa-onnx-darwin-${arch}
      to: sherpa
      filter: ["*.node", "*.dylib"]
  category: public.app-category.productivity
  extendInfo:
    # A menu-bar app: no Dock icon or Cmd+Tab entry from the moment it starts, so macOS does not add
    # it to the Dock's recent apps or the Apple menu's Recent Items. With "Keep out of recent
    # activity" turned off, the app switches itself to a regular Dock app at start.
    LSUIElement: true
    NSMicrophoneUsageDescription: Nexus AI transcribes your microphone when "You" is turned on.
    NSAudioCaptureUsageDescription: Nexus AI transcribes the other side of your call from system audio.
  # Ad-hoc signed ("-"): no Apple certificate, but the bundle is sealed so a downloaded copy is not
  # reported as "damaged". Users still confirm once via System Settings → Privacy & Security → Open Anyway.
  # For a real Developer ID signature + notarization, replace "-" with your identity (or set CSC_LINK /
  # CSC_KEY_PASSWORD) and turn hardenedRuntime back on.
  identity: "-"
  # Must stay false while ad-hoc signed: hardened runtime's library validation rejects Electron's framework.
  hardenedRuntime: false
dmg:
  # No version in the file name, so .../releases/latest/download/<name> is a permanent download link.
  artifactName: Nexus-AI-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: node_modules/sherpa-onnx-win-${arch}
      to: sherpa
      filter: ["*.node", "*.dll"]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Nexus-AI-Setup-${arch}.${ext}
